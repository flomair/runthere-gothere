<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 124" fill="none">
  <title>Run There · Go There</title>
  <!-- route: teal near the goal, orange in the middle, navy near the start -->
  <path d="M80 41 H44 C27 41 27 71 44 71" stroke="#2A9D8F" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 8"/>
  <path d="M50 72 H86 C104 72 104 106 86 106" stroke="#F4511E" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 8"/>
  <path d="M79 108 H51" stroke="#1D3557" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 8"/>
  <!-- footprints -->
  <g fill="#1D3557">
    <g transform="rotate(35 14 110)">
      <ellipse cx="14" cy="106" rx="5.8" ry="7.4"/>
      <ellipse cx="14" cy="118" rx="4.2" ry="3.8"/>
    </g>
    <g transform="rotate(35 31 103)">
      <ellipse cx="31" cy="99" rx="5.8" ry="7.4"/>
      <ellipse cx="31" cy="111" rx="4.2" ry="3.8"/>
    </g>
  </g>
  <!-- destination pin -->
  <path d="M82 6 C74.8 6 69 11.8 69 19 C69 28.8 82 38 82 38 C82 38 95 28.8 95 19 C95 11.8 89.2 6 82 6 Z" fill="#2A9D8F"/>
  <circle cx="82" cy="18.6" r="4.8" fill="#fff"/>
  <!-- finish flag -->
  <path d="M100 7 V39 M93 40.5 H107" stroke="#F4511E" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M101.5 7.5 H121 L115 14 L121 20.5 H101.5 Z" fill="#F4511E"/>
</svg>
